# Reproducible pipeline. `dvc repro` runs these in order and skips any stage whose
# deps have not changed.
#
# KNOWN LIMITATION: params.yaml is a whole-file dep, so changing any single param
# reruns every stage, including the `ingest` network download. DVC supports
# per-key param deps (`- params.yaml: [model.num_leaves]`) to make reruns selective;
# that syntax is not wired up here, so `dvc repro -s <stage>` is the workaround
# when you only want one stage.

stages:
  ingest:
    cmd: python src/ingest.py
    deps:
      - src/ingest.py
      - src/common.py
      - params.yaml
    outs:
      - data/raw/load_weather.csv

  features:
    cmd: python src/features.py
    deps:
      - src/features.py
      - src/common.py
      - params.yaml
    outs:
      - data/processed/features.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/features.py
      - src/common.py
      - params.yaml
    outs:
      - models/lgbm_load.txt
      - reports/train_metrics.json

  evaluate:
    cmd: python src/baseline.py && python src/evaluate.py
    deps:
      - src/baseline.py
      - src/evaluate.py
      - src/common.py
      - params.yaml
    outs:
      - metrics.json
      - reports/baseline_metrics.json
