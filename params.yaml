# Single source of truth for the pipeline. Every script and every DVC stage reads
# this file, so changing a number here and running `dvc repro` reruns exactly the
# stages that depend on it.

data:
  # 730 days, not 365: the drift monitor compares the last 30 days against the same
  # 30 days one year earlier, and a seasonal comparison needs two years of history
  # to exist. With only 365 days there is nothing to compare September against.
  ingest_days: 730
  # Time-based split only: the most recent 30 days are the test set, the 30 days
  # before that are validation. Nothing is ever shuffled.
  test_window_days: 30
  valid_window_days: 30

features:
  # Lags must stay >= 24 to avoid leakage into the day-ahead forecast.
  lag_hours: [24, 168]
  rolling_window_hours: 168
  weather_columns:
    - temperature_2m
    - wind_speed_10m
    - shortwave_radiation

model:
  # Small and regularised on purpose: ~8000 rows means overfitting is the real
  # risk, not capacity.
  objective: regression
  metric: mae
  learning_rate: 0.05
  num_leaves: 31
  min_data_in_leaf: 40
  feature_fraction: 0.9
  bagging_fraction: 0.9
  bagging_freq: 1
  seed: 42

baseline:
  # 7 days = the seasonal-naive lag.
  lag_hours: 168

promote:
  # A new model must beat the registered production model by at least this
  # percentage on test MAE to earn the "production" alias.
  min_improvement_pct: 1.0
  registered_model_name: energy-load-forecaster

drift:
  # Alert when the share of drifted columns exceeds this.
  drifted_column_share: 0.25
  # Per-column test, used by the Evidently report.
  p_value: 0.05
  # Compare the last 30 days against the training window.
  recent_window_days: 30
  # Reference window = the same 30 days, one year earlier. Comparing 30 days of
  # September against a year-long reference flags every season as drift; matching
  # the season is what makes the alert mean something.
  reference_lag_days: 365
  # Also alert when recent accuracy is worse than this percentage versus the MAE
  # the model achieved on its test window. This is the signal that actually matters:
  # distribution drift is only interesting once it costs accuracy.
  max_mae_degradation_pct: 5.0

api:
  horizon_hours: 24
