name: Deploy to Hugging Face Space

# Manual only. Deployments are deliberate: the Space is the public endpoint, so
# nothing ships without someone pressing the button on this workflow.
on:
  workflow_dispatch:
    inputs:
      space:
        description: "HF Space repo, e.g. your-username/energy-forecast"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::HF_TOKEN is not set in repository secrets"; exit 1; }

      # The Space needs data/ and models/, which are gitignored in the project.
      # Build a model from a short history so the image is self-contained, then
      # copy the two gitignored files into the payload.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare the model
        run: |
          python -m dvc pull -q || echo "no DVC remote, using local data"
          python src/ingest.py
          python src/train.py

      - name: Assemble the Space payload
        run: |
          mkdir -p deploy/space
          cp -r src app requirements.txt params.yaml deploy/
          cp space/Dockerfile space/README.md deploy/space/
          mkdir -p deploy/data/raw deploy/models
          cp data/raw/load_weather.csv deploy/data/raw/
          cp models/lgbm_load.txt deploy/models/
          ls -R deploy | head -30

      # HF_TOKEN is only ever passed through the environment for this one command.
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ inputs.space }}
        run: |
          cd deploy
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy energy-forecast API"
          git push "https://user:$HF_TOKEN@huggingface.co/spaces/$SPACE" HEAD:main
