name: Retrain weekly

# Refreshes the data, retrains, asks the promotion gate whether the new model is
# actually better, and monitors the result for drift.
#
# The pipeline is identical locally and in CI: the only difference is the tracking
# URI, which comes from a secret so switching to DagsHub needs no code change.
on:
  schedule:
    # 04:17 every Monday. Not midnight: the scheduled runs are queued by GitHub and
    # the top of the hour is the busiest slot.
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # DagsHub credentials live in repository secrets, never in the repo. MLFLOW_
      # TRACKING_URI is read by common.tracking_uri(), so the same code runs locally
      # against ./mlruns and here against the remote store.
      - name: Configure DagsHub credentials
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          if [ -n "$DAGSHUB_TOKEN" ]; then
            echo "using DagsHub tracking at $MLFLOW_TRACKING_URI"
          else
            echo "DAGSHUB_TOKEN is not set, falling back to the local ./mlruns store"
          fi

      # Graceful: the first run has no remote data yet, and that must not fail the job.
      - name: Pull versioned data
        continue-on-error: true
        run: |
          dvc remote list || echo "no DVC remote configured, using the data already in the image"
          dvc pull -q || echo "dvc pull skipped, continuing"

      - name: Ingest, features, train, evaluate
        run: dvc repro -f

      - name: Promotion gate
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: python src/promote.py

      - name: Drift monitoring
        run: python src/monitor.py

      # The notification the whole pipeline exists to produce: something moved
      # enough to trip the drift threshold, and the gate did not accept a new model.
      - name: Fail if drift detected without a promotion
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          drift = json.loads(pathlib.Path("reports/drift.json").read_text())
          promo = json.loads(pathlib.Path("reports/promotion.json").read_text())
          print(f"drift_detected={drift['drift_detected']} "
                f"drifted_share={drift['drifted_column_share']:.2f} "
                f"promoted={promo['promoted']}")
          if drift["drift_detected"] and not promo["promoted"]:
              print("::error::Drift detected and the new model was not promoted. "
                    "Investigate the data or the model before trusting the API.")
              sys.exit(1)
          PY

      - name: Upload reports and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-reports
          path: |
            reports/
            metrics.json
            dvc.lock
          retention-days: 30
