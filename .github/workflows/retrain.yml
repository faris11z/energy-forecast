name: Retrain weekly

# Refreshes the data, retrains, asks the promotion gate whether the new model is
# actually better, and monitors the result for drift.
#
# The pipeline is identical locally and in CI: the only difference is the tracking
# URI, which comes from a secret so switching to DagsHub needs no code change.
on:
  schedule:
    # 04:17 every Monday. Not midnight: the scheduled runs are queued by GitHub and
    # the top of the hour is the busiest slot.
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      # DagsHub is configured in exactly one place. Only the token is a secret.
      # The URLs are public, so committing them keeps them visible in the Actions
      # log when something breaks instead of hidden behind a blank secret name.
      #
      # MLFLOW_TRACKING_USERNAME/PASSWORD are not optional: DagsHub's MLflow server
      # requires basic auth, and without them every track.py/promote.py call 401s.
      # common.tracking_uri() only supplies the URI; MLflow consumes these two itself.
      MLFLOW_TRACKING_URI: https://dagshub.com/faris11z/energy-forecast.mlflow
      MLFLOW_TRACKING_USERNAME: faris11z
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      DVC_S3_ENDPOINT: https://dagshub.com/faris11z/energy-forecast.s3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-pipeline.txt

      # The DVC remote is a local config file, and a fresh checkout does not have
      # the credentials to use one. This step is what actually points DVC at
      # DagsHub; without it `dvc pull` finds no remote and the pipeline silently
      # re-downloads from the public APIs instead of using versioned data.
      - name: Configure the DVC remote
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -z "$DAGSHUB_TOKEN" ]; then
            echo "::warning::DAGSHUB_TOKEN is not set. dvc push/pull are disabled;"
            echo "the ingest stage will download fresh data from the public APIs."
            exit 0
          fi
          dvc remote remove origin 2>/dev/null || true
          # DagsHub exposes an S3-compatible endpoint. The --local flag on the two
          # credential lines is the important part: .dvc/config is committed to git,
          # so a plain `dvc remote modify` would commit the token.
          dvc remote add -d origin s3://dvc
          dvc remote modify origin endpointurl "$DVC_S3_ENDPOINT"
          dvc remote modify origin --local access_key_id "$DAGSHUB_TOKEN"
          dvc remote modify origin --local secret_access_key "$DAGSHUB_TOKEN"
          dvc remote list

      - name: Pull versioned data
        continue-on-error: true
        run: |
          if dvc remote list | grep -q origin; then
            dvc pull -q || echo "::warning::dvc pull failed, continuing with a fresh ingest"
          else
            echo "no DVC remote, the ingest stage will download fresh data"
          fi

      - name: Ingest, features, train, evaluate
        run: dvc repro -f

      # Log the baseline and the model run, so the remote registry holds the
      # experiment history and not just promotion candidates.
      - name: Log runs to MLflow
        run: python src/track.py

      - name: Promotion gate
        run: python src/promote.py

      - name: Drift monitoring
        run: python src/monitor.py

      - name: Push the updated data
        continue-on-error: true
        run: |
          if dvc remote list | grep -q origin; then
            dvc push -q || echo "::warning::dvc push failed"
          fi

      # The notification the whole pipeline exists to produce. drift_detected
      # follows accuracy, not distribution: September 2026 really was warmer than
      # September 2025 and the model absorbed it, so paging on that would be noise.
      # This fires when the model is genuinely degrading AND the retrain did not
      # produce something better.
      - name: Fail if the model is degrading and nothing was promoted
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          drift = json.loads(pathlib.Path("reports/drift.json").read_text())
          promo = json.loads(pathlib.Path("reports/promotion.json").read_text())
          accuracy = drift.get("prediction_error", {})
          print(f"drift_detected={drift['drift_detected']} "
                f"accuracy_degradation={accuracy.get('degradation_pct', 'n/a')}% "
                f"distribution_drift={drift.get('distribution_drift')} "
                f"promoted={promo['promoted']}")
          if drift["drift_detected"] and not promo["promoted"]:
              print("::error::Model accuracy is degrading and the new model was not "
                    "promoted. Investigate before trusting the API.")
              sys.exit(1)
          PY

      # Diagnostics, not a deliverable. The real outputs already reached DagsHub by
      # this point: data via `dvc push`, runs and the promoted model via MLflow. So a
      # flaky artifact service must not be able to fail an otherwise good retrain.
      # This step has `continue-on-error` because Azure blob storage returned
      # "Error: The server is busy" on a run where every pipeline step had succeeded.
      - name: Upload reports and metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: retrain-reports
          # Listed explicitly rather than uploading reports/. drift.html is a 3.7 MB
          # generated Evidently report that was the entire upload payload; the
          # machine-readable outputs that the gate above actually reads total ~12 KB.
          path: |
            reports/drift.json
            reports/promotion.json
            reports/feature_importance.csv
            metrics.json
            dvc.lock
          retention-days: 30
